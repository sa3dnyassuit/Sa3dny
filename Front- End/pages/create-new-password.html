<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Sa3dny | Create New Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- CSS -->
  <link rel="stylesheet" href="../style/create-new-password.css" />
</head>

<body>

  <!-- ================= NAVBAR ================= -->
  <nav class="navbar">
    <div class="back">
      <button class="back-btn" onclick="history.back()" data-ar="رجوع" data-en="back">back</button>
    </div>

    <div class="nav-logo">
      <img src="../images/logo white.PNG" alt="Sa3dny">
    </div>

    <div class="toggle-btn" id="toggle-btn">
      <div class="toggle-circle" id="language-circle">English</div>
    </div>

    <ul class="nav-links">
      <li><a href="#" data-ar="خدمات" data-en="Services">Services</a></li>
      |
      <li><a href="../pages/register.html" data-ar="تسجيل حساب جديد" data-en="Sign up">Sign up</a></li>
      |
      <li><a href="./login.html" data-ar="دخول" data-en="Log in">Log in</a></li>
      <li>
        <a href="../pages/become-provider.html" class="provider-btn" data-ar="إصبح مقدم خدمة" data-en="Become a Provider">
          Become a Provider
        </a>
      </li>
    </ul>
  </nav>

  <!-- ================= BACKGROUND ================= -->
  <div class="background"></div>

  <!-- ================= MAIN CONTENT ================= -->
  <div class="main-content">
    <div class="card">

      <img src="../images/logo white.PNG" alt="Sa3dny Logo" class="logo">

      <h2 class="title" data-ar="إنشاء كلمة مرور جديدة" data-en="Create New Password">
        Create New Password
      </h2>

      <p class="subtitle"
        data-ar="من فضلك أدخل كلمة مرور جديدة ثم أكدها"
        data-en="Please enter a new password and confirm it">
        Please enter a new password and confirm it
      </p>

      <form class="form" action="#" method="post">

        <div class="row">
          <input class="input" type="password" name="newPassword" placeholder="New Password"
            data-ar="كلمة المرور الجديدة" data-en="New Password" required>
        </div>

        <div class="row">
          <input class="input" type="password" name="confirmPassword" placeholder="Confirm Password"
            data-ar="تأكيد كلمة المرور" data-en="Confirm Password" required>
        </div>

        <button class="primary-btn" type="submit"
          data-ar="حفظ كلمة المرور" data-en="Save Password">
          Save Password
        </button>

        <a href="./login.html" class="secondary-link">
          <button class="secondary-btn" type="button"
            data-ar="العودة لتسجيل الدخول" data-en="Back to Log in">
            Back to Log in
          </button>
        </a>

        <p class="note"
          data-ar="تأكد أن كلمة المرور قوية وتحتوي على 8 أحرف على الأقل"
          data-en="Make sure your password is strong (at least 8 characters)">
          Make sure your password is strong (at least 8 characters)
        </p>

      </form>

    </div>
  </div>

  <!-- ================= HELP BUTTON ================= -->
  <button class="chat" data-ar="مساعدة ؟" data-en="Help?">Help?</button>

  <!-- ================= FOOTER ================= -->
  <footer class="footer">
    <div class="footer-links">
      <a href="#" data-ar="سياسة الخصوصية" data-en="Privacy Policy">Privacy Policy</a>
      <a href="#" data-ar="شروط الأستخدام" data-en="Terms of Use">Terms of Use</a>
      <a href="#" data-ar="تواصل معنا" data-en="Contact">Contact</a>
    </div>
  </footer>

  <script src="../script/translate.js"></script>
</body>

</html>
