<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sa3dny - OTP Verification</title>

  <!-- نفس CSS بتاع login -->
  <link rel="stylesheet" href="../style/forgot-password.css" />

  <!-- CSS إضافي خاص بالـ OTP -->
  <link rel="stylesheet" href="../style/otp.css" />
</head>

<body>
  <!-- ================= NAVBAR ================= -->
  <nav class="navbar">
    <div class="back">
      <button class="back-btn" onclick="history.back()">back</button>
    </div>
    <div class="nav-logo">
      <img src="../images/logo white.PNG" alt="Sa3dny">
    </div>

    <ul class="nav-links">
      <li><a href="#">Services</a></li>
      |
      <li><a href="../pages/register.html">Sign up</a></li>
      |
      <li><a href="./login.html">Log in</a></li>
      <li><a href="../pages/become-provider.html" class="provider-btn">Become a Provider</a></li>
    </ul>
  </nav>

  <!-- ================= BACKGROUND ================= -->
  <div class="background"></div>

  <div class="login-card otp-card">
    <h2 class="page-title" id="otp">OTP Verification</h2>
    <p class="page-desc" id="enter">
      Enter the verification code we just sent on your email address.
    </p>

    <form action="../pages/create-new-password.html">
      <div class="otp-one">
        <input class="otp-input" type="text" placeholder="Enter OTP" inputmode="numeric" maxlength="6" required />
      </div>

      <button class="btn" type="submit">Verify</button>
      <p class="otp-bottom">
        Didn't received code?
        <a href="#" class="otp-link">Resend</a>
      </p>
    </form>
  </div>

  <!-- ================= HELP BUTTON ================= -->
  <button class="chat">Help?</button>


  <!-- ================= FOOTER ================= -->
  <footer class="footer">
    <div class="footer-links">
      <a href="#">Privacy Policy</a>
      <a href="#">Terms of Use</a>
      <a href="#">Contact</a>
    </div>
  </footer>
</body>

</html>
