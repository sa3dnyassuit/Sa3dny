<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Sa3dny | Become a Provider</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- CSS -->
  <link rel="stylesheet" href="../style/become-provider.css" />
</head>

<body>

  <!-- ================= NAVBAR ================= -->
  <nav class="navbar">
    <div class="back">
      <button class="back-btn" onclick="history.back()" data-ar="رجوع" data-en="back">back</button>
    </div>

    <div class="nav-logo">
      <img src="../images/logo white.PNG" alt="Sa3dny">
    </div>

    <div class="toggle-btn" id="toggle-btn">
      <div class="toggle-circle" id="language-circle">English</div>
    </div>

    <ul class="nav-links">
      <li><a href="#" data-ar="خدمات" data-en="Services">Services</a></li>
      |
      <li><a href="../pages/register.html" data-ar="تسجيل حساب جديد" data-en="Sign up">Sign up</a></li>
      |
      <li><a href="../pages/login.html" data-ar="دخول" data-en="Log in">Log in</a></li>
      <li>
        <a href="../pages/become-provider.html" class="provider-btn" data-ar="إصبح مقدم خدمة" data-en="Become a Provider">
          Become a Provider
        </a>
      </li>
    </ul>
  </nav>

  <!-- ================= BACKGROUND ================= -->
  <div class="background"></div>

  <!-- ================= MAIN CONTENT ================= -->
  <div class="main-content">
    <div class="card">

      <img src="../images/logo white.PNG" alt="Sa3dny Logo" class="logo">

      <h2 class="title" data-ar="كن مقدم خدمة" data-en="Become a Provider">Become a Provider</h2>

      <p class="subtitle" data-ar="املأ البيانات للانضمام كمقدم خدمة على ساعدنى"
        data-en="Fill your info to join Sa3dny as a service provider">
        Fill your info to join Sa3dny as a service provider
      </p>

      <form class="form" action="#" method="post">

        <div class="row">
          <input class="input" type="text" name="fullName" placeholder="Full Name"
            data-ar="الاسم بالكامل" data-en="Full Name" required>
        </div>

        <div class="row">
          <input class="input" type="tel" name="phone" placeholder="Phone Number"
            data-ar="رقم الهاتف" data-en="Phone Number" required>
        </div>

        <div class="row">
          <input class="input" type="email" name="email" placeholder="Email"
            data-ar="البريد الإلكتروني" data-en="Email" required>
        </div>

        <div class="row two">
          <input class="input" type="text" name="city" placeholder="City"
            data-ar="المدينة" data-en="City" required>

          <input class="input" type="text" name="area" placeholder="Area"
            data-ar="المنطقة" data-en="Area" required>
        </div>

        <div class="row">
          <select class="input select" name="service" required>
            <option value="" selected disabled data-ar="اختر الخدمة" data-en="Select Service">
              Select Service
            </option>

            <option value="plumbing" data-ar="سباكة" data-en="Plumbing">Plumbing</option>
            <option value="electric" data-ar="كهرباء" data-en="Electrician">Electrician</option>
            <option value="carpentry" data-ar="نجارة" data-en="Carpentry">Carpentry</option>
            <option value="cleaning" data-ar="تنظيف" data-en="Cleaning">Cleaning</option>
            <option value="painting" data-ar="دهانات" data-en="Painting">Painting</option>
          </select>
        </div>

        <div class="row">
          <textarea class="input textarea" name="bio" rows="4" placeholder="Tell us about your experience..."
            data-ar="احكي لنا عن خبرتك..." data-en="Tell us about your experience..."></textarea>
        </div>

        <div class="row">
          <label class="file-label" data-ar="ارفع صورة البطاقة / رخصة مزاولة"
            data-en="Upload ID / License">
            Upload ID / License
          </label>
          <input class="file" type="file" name="documents" accept=".png,.jpg,.jpeg,.pdf">
        </div>

        <button class="primary-btn" type="submit" data-ar="إرسال الطلب" data-en="Submit Request">
          Submit Request
        </button>

        <a href="./login.html" class="secondary-link">
          <button class="secondary-btn" type="button" data-ar="لديك حساب؟ تسجيل الدخول"
            data-en="Already have an account? Log in">
            Already have an account? Log in
          </button>
        </a>

        <p class="note" data-ar="بالضغط على إرسال، أنت توافق على الشروط وسياسة الخصوصية"
          data-en="By submitting, you agree to Terms of Use and Privacy Policy">
          By submitting, you agree to Terms of Use and Privacy Policy
        </p>

      </form>

    </div>
  </div>

  <!-- ================= HELP BUTTON ================= -->
  <button class="chat" data-ar="مساعدة ؟" data-en="Help?">Help?</button>

  <!-- ================= FOOTER ================= -->
  <footer class="footer">
    <div class="footer-links">
      <a href="#" data-ar="سياسة الخصوصية" data-en="Privacy Policy">Privacy Policy</a>
      <a href="#" data-ar="شروط الأستخدام" data-en="Terms of Use">Terms of Use</a>
      <a href="#" data-ar="تواصل معنا" data-en="Contact">Contact</a>
    </div>
  </footer>

  <script src="../script/translate.js"></script>
</body>

</html>
